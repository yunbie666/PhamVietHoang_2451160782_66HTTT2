<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="form-card">
            <div class="form-header">
                <h1>📝 Đăng Ký Tài Khoản</h1>
                <p>Điền đầy đủ thông tin để tạo tài khoản</p>
            </div>

            <form id="registerForm" novalidate>

                <!-- Tên -->
                <div class="field-group" id="group-name">
                    <label for="inputName">Họ và Tên</label>
                    <div class="input-wrapper">
                        <input type="text" id="inputName" placeholder="Nguyễn Văn A" autocomplete="name">
                        <span class="field-icon" id="icon-name"></span>
                    </div>
                    <div class="field-msg" id="msg-name"></div>
                </div>

                <!-- Email -->
                <div class="field-group" id="group-email">
                    <label for="inputEmail">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="inputEmail" placeholder="example@email.com" autocomplete="email">
                        <span class="field-icon" id="icon-email"></span>
                    </div>
                    <div class="field-msg" id="msg-email"></div>
                </div>

                <!-- Password -->
                <div class="field-group" id="group-password">
                    <label for="inputPassword">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="inputPassword" placeholder="Nhập mật khẩu..." autocomplete="new-password">
                        <button type="button" class="toggle-pw" id="togglePw">👁</button>
                    </div>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <div class="field-msg" id="msg-password"></div>
                </div>

                <!-- Confirm Password -->
                <div class="field-group" id="group-confirm">
                    <label for="inputConfirm">Xác nhận mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="inputConfirm" placeholder="Nhập lại mật khẩu..." autocomplete="new-password">
                        <span class="field-icon" id="icon-confirm"></span>
                    </div>
                    <div class="field-msg" id="msg-confirm"></div>
                </div>

                <!-- Phone -->
                <div class="field-group" id="group-phone">
                    <label for="inputPhone">Số điện thoại</label>
                    <div class="input-wrapper">
                        <input type="tel" id="inputPhone" placeholder="0901-234-567" maxlength="12" autocomplete="tel">
                        <span class="field-icon" id="icon-phone"></span>
                    </div>
                    <div class="field-msg" id="msg-phone"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit" disabled>
                    Đăng Ký
                </button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay hidden" id="successModal">
        <div class="modal-box">
            <div class="modal-icon">🎉</div>
            <h2>Đăng ký thành công!</h2>
            <div class="modal-info" id="modalInfo"></div>
            <button id="modalOkBtn" class="btn-submit" style="margin-top:20px">OK</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
