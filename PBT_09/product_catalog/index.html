<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">🛒 ShopVN</div>
            <div class="header-actions">
                <button id="darkModeToggle" class="btn-dark" aria-label="Toggle dark mode">🌙 Dark Mode</button>
                <div class="cart-icon" id="cartIcon">
                    🛍️
                    <span class="cart-badge hidden" id="cartBadge">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Controls -->
    <div class="controls-bar">
        <input id="searchInput" type="text" placeholder="🔍 Tìm kiếm sản phẩm..." class="search-input">
        <div class="category-filters" id="categoryFilters">
            <!-- Render bằng JS -->
        </div>
        <select id="sortSelect" class="sort-select">
            <option value="">Sắp xếp...</option>
            <option value="price-asc">Giá tăng dần</option>
            <option value="price-desc">Giá giảm dần</option>
            <option value="name-asc">Tên A-Z</option>
            <option value="rating-desc">Đánh giá cao nhất</option>
        </select>
    </div>

    <!-- Product Grid -->
    <main class="product-grid" id="productGrid">
        <!-- Render bằng JS -->
    </main>

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
